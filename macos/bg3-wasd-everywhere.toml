# Settings for BG3 WASD Everywhere, the macOS port. The mod reloads this file about a second after
# you save it.

[ModHotkeys]
# For the names of all available keys, see the bottom of this config file.
# Letter, digit and symbol keys are physical key positions, named after the US QWERTY layout. On an
# AZERTY keyboard, key:w is the key labeled Z, so the defaults work on any layout.
# On a Mac keyboard, alt is Option and gui is Command: key:lalt is the left Option key.

ToggleMovementMode = "key:capslock"
# Key that toggles between Character and Camera movement mode.

HoldMovementMode = ""
# Switch between Character and Camera movement mode while you hold this key.

ToggleCameraRotation = ""
# Toggles the camera rotation to enable full mouselook.
# The game takes every mouse button but the left and the right one as its middle button, the one
# that rotates. On one of them, e.g. "mouse:x1", the mod keeps that click from the game.

ToggleAutoforward = "shift+key:w"
# Lets you move forward without holding Forward.

ToggleWalkspeed = ""
# Toggles between walking and jogging movespeed.

HoldWalkspeed = ""
# When you are jogging, holding this key will make you walk.
# If you are walking, holding this key will make you jog.

ReloadConfig = ""
# Reloads this file. Usually not needed: the mod reloads it about a second after you save it.


[CameraRotation]

CharacterMovementRotationCursor = "invisible"
# What the mouse cursor does while you rotate the camera with the mouse (the middle mouse button by
# default) in Character movement mode.
# Option 1: "invisible"
#            The cursor is invisible and stays where it was. Rotation doesn't stop at the screen
#            edge, and nothing under the cursor gets highlighted or clicked meanwhile.
# Option 2: "centered"
#            The cursor moves to the center of the window and shows the game's rotation icon.
#            It comes back to the same spot when you stop rotating.
# Option 3: "vanilla"
#            The cursor moves like in vanilla BG3.

CameraMovementRotationCursor = "invisible"
# Same as CharacterMovementRotationCursor, but for the Camera movement mode.

TogglingMovementModeAlsoTogglesCameraRotation = false
# If true, when you switch to Character movement mode, the mod will toggle on camera rotation,
# and when you switch to Camera movement mode, the mod will toggle off camera rotation.
# [true, false]

MouselookPauseKeys = "key:i,key:m,key:j,key:k,key:n,key:tab,key:b,key:l,key:p,key:h"
# Keys that open the game's panels: inventory, map, journal and so on.
# Opening a panel with one of these keys pauses mouselook. It resumes when you close the panel with
# the same key or Esc, or when you press ToggleCameraRotation.
# The default is the game's Adventure Panels keys. If you rebind them in the game, change this too.
# The game menu, dialogs, loading screens and text fields pause mouselook without any keys.

RotatePlusLeftclickMovesForward = true
# While you rotate the camera, holding the left mouse button moves your character forward.
# [true, false]

PreventClickingCameraOccluders = false
# If true, the cursor ignores objects that are closer to the camera than the active character, in
# Character movement mode. This prevents accidentally clicking on your trailing companions. If you
# zoom out a lot or have a steep camera angle, the mod makes an exception. Vanilla is false.
# [true, false]

PreventClickingActiveCharacter = true
# If true, the cursor ignores the active character, in Character movement mode. This prevents
# accidentally opening the context menu on them, or clicking your character instead of the
# object or ground behind it. Vanilla is false.
# [true, false]

MaxClickDistanceBehindCharacter = 1.0
# With PreventClickingActiveCharacter, how far behind the active character, in meters, a click
# through them may land on the ground. With a low camera, the cursor passes through your character
# and reaches the ground far behind, and a click there sends the character running off. Further than
# this, your character stays under the cursor, as in vanilla. Objects behind your character count by
# the ground under the cursor's line, not by their own distance. 1000 means no limit.


[Walking]

WalkSpeed = 0.3
# 1.0 would be the normal jog speed from vanilla. 0.5 would be 50% of that.
# You cannot make the character move faster than vanilla with this option.
# [0.0, 1.0]

IsWalkingDefault = false
# Whether the character walks, when the game starts up.
# [true, false]


[AutoToggleMovementMode]

IsCharacterMovementDefault = true
# Whether the game starts in Character or Camera movement mode.
# [true, false]


# Camera tweaks, ported from Native Camera Tweaks by ersh1:
# https://www.nexusmods.com/baldursgate3/mods/945
# The key names are the same as in BG3NativeCameraTweaks.toml, so you can copy your values over.
# Not ported yet: the gamepad settings, keeping the camera above the floor
# (UnlockedPitchLimitClipping) and ResetZoomOnZoneChange.

[CameraTweaks]

CameraTweaks = true
# Turns all the camera tweaks below on or off. Vanilla is false.
# [true, false]

UnlockedPitchInitialValue = 25.0
# The pitch, in degrees, the free camera starts with.

UnlockedPitchClampSpeed = 5.0
# How fast the pitch returns into its limits, or to the game's pitch when it gets locked again.


[ExplorationPitch]

ExplorationUnlockPitch = true
# Out of combat, move the mouse up and down while you rotate the camera to change its pitch.
# [true, false]

ExplorationKeepTacticalPitchLocked = false
# Keep the game's pitch in the tactical camera (the far top-down view).
# [true, false]

ExplorationUnlockedPitchMin = 0.0
ExplorationUnlockedPitchMax = 85.0
# The limits of the free pitch, in degrees: 0 looks straight ahead, 85 almost straight down.
# Native Camera Tweaks allows down to -85, but below 0 the camera can go under the ground here: the
# check that keeps it above the floor isn't ported yet.
# [-89, 89]

ExplorationOverrideLockedPitch = false
# Change the game's own pitch, used when the pitch isn't free. Close is when zoomed in, Far when
# zoomed out. The values shown are vanilla.
ExplorationLockedPitchClose = 19.05
ExplorationLockedPitchFar = 40.71
ExplorationLockedTacticalPitchClose = 85.55
ExplorationLockedTacticalPitchFar = 85.55
ExplorationLockedAltPitchClose = 32.69
ExplorationLockedAltPitchFar = 39.7


[ExplorationZoom]

ExplorationOverrideZoom = true
# Change the zoom limits. Vanilla is 3.5 to 12, tactical 10 to 50, alternative 10 to 40.
# [true, false]
ExplorationZoomMin = 0.5
ExplorationZoomMax = 20.0
ExplorationTacticalZoomMin = 10.0
ExplorationTacticalZoomMax = 50.0
ExplorationAltZoomMin = 10.0
ExplorationAltZoomMax = 40.0


[ExplorationFOV]

ExplorationOverrideFOV = false
# Change the field of view, in degrees. The values shown are vanilla.
# [true, false]
ExplorationFOVClose = 55.0
ExplorationFOVFar = 55.0
ExplorationTacticalFOV = 25.0
ExplorationAltFOVClose = 45.0
ExplorationAltFOVFar = 45.0


[ExplorationOffset]

ExplorationOverrideOffset = false
# Move the camera sideways (an over-the-shoulder view) or up. The values shown are vanilla.
# [true, false]
ExplorationHorizontalOffsetMult = 0.0
ExplorationVerticalOffsetMult = 0.8


[CombatPitch]

# The same as the Exploration settings above, in combat.
CombatUnlockPitch = true
CombatKeepTacticalPitchLocked = false
CombatUnlockedPitchMin = 0.0
CombatUnlockedPitchMax = 85.0
CombatOverrideLockedPitch = false
CombatLockedPitchClose = 32.73
CombatLockedPitchFar = 52.42
CombatLockedTacticalPitchClose = 85.55
CombatLockedTacticalPitchFar = 85.55
CombatLockedAltPitchClose = 32.69
CombatLockedAltPitchFar = 39.7


[CombatZoom]

# Vanilla is 4 to 15, tactical 10 to 50, alternative 10 to 40.
CombatOverrideZoom = true
CombatZoomMin = 0.5
CombatZoomMax = 20.0
CombatTacticalZoomMin = 10.0
CombatTacticalZoomMax = 50.0
CombatAltZoomMin = 10.0
CombatAltZoomMax = 40.0


[CombatFOV]

CombatOverrideFOV = false
CombatFOVClose = 55.0
CombatFOVFar = 55.0
CombatTacticalFOV = 25.0
CombatAltFOVClose = 45.0
CombatAltFOVFar = 45.0


[CombatOffset]

CombatOverrideOffset = false
CombatHorizontalOffsetMult = 0.0
CombatVerticalOffsetMult = 0.8


[Mouse]

MouseCameraRotationMult = 1.0
# Speed of the camera rotation with the mouse. 1.0 is vanilla.

MousePitchMult = 0.25
# Speed of the free pitch with the mouse.

MouseZoomMult = 0.5
# Speed of the zoom with the mouse wheel. 1.0 is vanilla.

InvertMousePitch = false
# [true, false]


[Keyboard]

KeyboardCameraRotationMult = 2.0
# Speed of the camera rotation with the keys. 1.0 is vanilla.


# Not available on macOS yet, and ignored if present: SwitchToWalkingAfterCombat,
# AutoToggleMovementMode, BlockInteractMove.


# List of all available keys for mod hotkeys:

# Modifiers: ctrl, shift, alt (Option). E.g. "ctrl+shift+key:w"
# Multiple keycombos possible, separated by comma: "key:x,ctrl+key:y"

# mouse:left            mouse:right             mouse:middle
# mouse:x1              mouse:x2

# key:a                 key:b                   ...                     key:z
# key:1                 key:2                   ...                     key:0
# key:f1                key:f2                  ...                     key:f20

# key:left              key:up                  key:right               key:down
# key:tab               key:return              key:capslock            key:space
# key:escape            key:home                key:end                 key:pageup
# key:pagedown
# key:backspace (the Delete key)
# key:delete (Forward Delete)
# key:insert (Help, on keyboards that have it)
# key:numlock (Clear on the keypad)

# key:lalt              key:ralt                (Option)
# key:lshift            key:rshift
# key:lctrl             key:rctrl
# key:lgui              key:rgui                (Command)

# key:;                 key:=                   key:,                   key:'
# key:-                 key:.                   key:/                   key:`
# key:[                 key:]
# key:\\ (Backslash is a very special character in the toml format. You must either
# write xxx="key:\\" or xxx='key:\' for it to work.)

# key:kp_0              key:kp_1                ...                     key:kp_9
# key:kp_multiply       key:kp_plus             key:kp_period           key:kp_divide
# key:kp_minus
